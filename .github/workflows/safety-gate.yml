# Safety gate for whittworkstudios.com. A push to main goes live (GitHub Pages, and the Netlify project
# "whittworks"), so with branch protection on, main only changes through a pull request that passes this.
# The tree is the built copy of notcadenwhitt-stack/whittworks-CorkboardTesting-site (tools/release/build.py),
# whose own safety gate builds and checks it in headless Chrome before a release. This checks the copy that
# actually ships: no leaked keys, still build output, CNAME and Search Console file intact, CSP no looser than
# .github/safety/csp-baseline.json, every internal link resolves, the HTML parses.
# A release replaces the tree with build output: keep .github/ when you do, or this gate goes with it.
# Third-party code is pinned: actions by commit hash, gitleaks and actionlint by version and sha256,
# zizmor and html-validate by version.
name: safety-gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: safety-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks 8.30.1
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan every commit for keys and tokens
        run: '"$RUNNER_TEMP/gitleaks" git . --config .github/safety/gitleaks.toml --redact --no-banner --verbose'

  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint 1.7.12
        run: |
          curl -sSfL -o "$RUNNER_TEMP/actionlint.tgz" https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tgz" -C "$RUNNER_TEMP" actionlint
      - name: Workflows are valid (actionlint)
        run: '"$RUNNER_TEMP/actionlint" -color'
      - name: Workflows have no known security holes (zizmor)
        if: ${{ !cancelled() }}
        run: pipx run zizmor==1.30.1 --offline --min-severity medium .github/workflows

  site-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      # Each check runs even when another failed, so one red line never hides the next.
      - name: Tree is build output, CNAME and Search Console file intact
        run: python3 -I .github/safety/site_checks.py built .
      - name: CSP is no looser than the baseline, inline script hash current
        if: ${{ !cancelled() }}
        run: python3 -I .github/safety/site_checks.py csp . .github/safety/csp-baseline.json
      - name: Every internal link and asset exists
        if: ${{ !cancelled() }}
        run: python3 -I .github/safety/site_checks.py links .
      - name: HTML parses cleanly
        if: ${{ !cancelled() }}
        run: find . -path ./.git -prune -o -name '*.html' ! -name 'google*.html' -print0 | xargs -0 npx --yes html-validate@11.17.0 -c .github/safety/htmlvalidate.json
